name: Build KasariChauhanLiveUpdate APK

on:
  push:
    branches: [ main ]
    paths:
      - 'KasariChauhanLiveUpdate/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KasariChauhanLiveUpdate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('KasariChauhanLiveUpdate/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KasariChauhan-debug-apk
          path: KasariChauhanLiveUpdate/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KasariChauhan-release-apk
          path: KasariChauhanLiveUpdate/app/build/outputs/apk/release/*.apk
          retention-days: 30
